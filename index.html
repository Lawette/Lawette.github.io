<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dive Testing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Start screen -->
        <section id="start-screen">
            <h1>Is this bar a proper dive bar?</h1>

            <button id="start-button">I want to know!</button>
        </section>


        <!-- Question screen -->
        <section id="quiz-screen" class="hidden">

            <div class="progress">
                Question <span id="question-number">1</span>
                of <span id="question-total">10</span>
            </div>

            <h2 id="question-text">
                Question goes here
            </h2>

            <div class="answer-buttons">
                <button id="yes-button">Yes</button>
                <button id="no-button">No</button>
            </div>

        </section>


        <!-- Results screen -->
        <section id="result-screen" class="hidden">

            <h1>Results</h1>

            <p>
                Your score:
                <strong id="score">0</strong>
                /
                <span id="score-total">10</span>
            </p>

            <p id="result-message"></p>

            <button id="restart-button">
                Try Again
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
